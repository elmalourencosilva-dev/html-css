<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexivel</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência.😊</p>
    <picture>
        <source media="(max-width: 350px)" srcset="imagens/imagem300.jpg">
        <source media="(max-width: 550px)" srcset="imagens/imagem500.jpg">
        <img src="imagens/imagem1000.jpg" alt="Imagem flexível" style="width: 100%; height: auto;">
    </picture>
</body>
</html>
