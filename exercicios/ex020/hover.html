<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, helvetica, sans-serif;
           
        }
        div > p{
            display: none;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: rgb(54, 54, 93);
            width: 200px;
            text-align: center;
        }
        div:hover {
            color: rgb(110, 110, 56);
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobre o botão abaixo para ver o efeito de hover:</p>
   <div>passe o mouse aqui
     <p>texto escondido</p>
     </div>
  
</body>
</html>
