<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    <style>
        h1 {/* h1 é um elemento de nível de bloco (block-level)*/
            background-color: #dd9f9f;
            height: 300px;
            width: 50%;
            text-align: center;

            /* A propriedade border é usada para definir a largura, estilo e cor da borda de um elemento.  para simplificar todos elementos é só usar o shorthand 
            border: 10px solid blue; */
            border-width: 20px;
            border-style: solid;
            border-color: blue;

            /* A propriedade padding é usada para definir o espaço entre o conteúdo de um elemento e sua borda.  para simplificar todos elementos é só usar o shorthand
            padding: 20px 10px ; */
            padding-top: 20px;            
            padding-right: 10px;           
            padding-bottom: 20px;
            padding-left: 10px;
            border-color: rgb(115, 231, 145);

            /* A propriedade margin é usada para definir o espaço entre a borda de um elemento e os elementos adjacentes.  para simplificar todos elementos é só usar o shorthand margin: 10px auto red; */
            margin-top: 10px;
            margin-right: auto  ;
            margin-bottom: 10px;
            margin-left: auto ;
            margin-color: red ;
        }
        p { /* p é um elemento de nível de bloco (block-level) */
            margin: 50px 0;
            padding: 10px;
            border-width: 8px;
            border-style: solid;
            border-color: aquamarine;
        }
        a {
            color: blue;
            text-decoration: none;
            border-width: 2px;
            border-style: solid;
            border-color: brown;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixas box-level</h1>
    <p>Paragrafos tambem são exemplos box-level. Mas os <a href="#">links são exemplos de box inline</a>. Vamos ver como tudo funciona.</p>
    <h2></h2>
</body>
</html>
